name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Server ──────────────────────────────────────────────
  server-lint:
    name: Server — Lint & Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check

  server-test:
    name: Server — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Coverage thresholds are floors set from measured values; see vitest.config.ts.
      - run: npm run test:coverage

  server-build:
    name: Server — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build

  # ── Client ──────────────────────────────────────────────
  client-lint:
    name: Client — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # Explicit, not left to `next build`: the build type-checks the app graph,
      # which does not include the test files.
      - run: npm run type-check
      - run: npm run lint

  client-test:
    name: Client — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # Coverage thresholds are floors; the crypto core is held to a much higher
      # bar than the UI. See vitest.config.ts.
      - run: npm run test:coverage

  client-build:
    name: Client — Build
    needs: [client-lint, client-test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
          NEXT_PUBLIC_WS_URL: ws://localhost:3001/ws

  guards:
    name: Guards — i18n, design tokens
    runs-on: ubuntu-latest
    # Both scripts existed and passed, and neither was wired in, so they blocked
    # nothing. (The internal repository also runs a rules-sync guard; the files
    # it compares are not part of this snapshot.)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      # These use only Node builtins, so no install step is needed.
      - run: npm run check:i18n
      - run: npm run check:css

  dep-audit:
    name: Dependencies — Advisory audit
    runs-on: ubuntu-latest
    # Two thresholds, because the two trees carry different risk. The production
    # tree is the code that reaches a user's browser and holds their keys, so a
    # *moderate* advisory there fails the build. The full tree adds build and test
    # tooling, which runs on a developer machine and in this runner and never
    # ships; that is held to *high*.
    strategy:
      fail-fast: false
      matrix:
        workspace: [server, client]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      # npm audit resolves from the lockfile and the registry — no install needed.
      - name: Production tree (moderate+ fails)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Full tree incl. dev tooling (high+ fails)
        # `if: always()` so a production failure still reports the dev-tree state
        # in the same run, rather than hiding it behind the first red step.
        if: always()
        run: npm audit --audit-level=high
